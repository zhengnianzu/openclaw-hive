global:
  controlplane_base_url: http://192.168.11.87:30081
  api_key: omni-env-default-api-key
  logger:
    name: env_sdk_client
    level: INFO
    dir: logs
    console: true
    file: true
    stream: stdout
    max_backup_count: 14
    encoding: utf-8
    format: '%(asctime)s|%(filename)s:%(lineno)d|%(funcName)s|%(process)d|%(thread)d|%(threadName)s|%(levelname)s|%(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'
    when: midnight
    interval: 1
sandbox:
  x86_cpu:
    architecture: x86
    accelerator: null
    lease_ttl_seconds: 900
    max_ttl_second: 20000
    wait_timeout_seconds: 1200
    sandbox:
      image: swr.cn-east-4.myhuaweicloud.com/rl_team/multiharness:26.9.24v1
      env:
      - name: PIP_INDEX_URL
        value: https://mirrors.huaweicloud.com/repository/pypi/simple
      - name: PIP_TRUSTED_HOST
        value: mirrors.huaweicloud.com
      - name: NODE_TLS_REJECT_UNAUTHORIZED
        value: '0'
      - name: SERPER_API_KEY
        value: sk-kjXmrAI6yqjFgZ2agNnEA8s73jaHYqWgD3yDF6yXRzNmsZsK
      - name: SERPER_API_URL
        value: https://yibuapi.com/serper/
      - name: OPENCLAW_SDK_RETRY_MAX_WAIT_SECONDS
        value: 'off'
      - name: SEARCH_API_KEY
        value: sk-kjXmrAI6yqjFgZ2agNnEA8s73jaHYqWgD3yDF6yXRzNmsZsK
      - name: SEARCH_BACKEND_URL
        value: https://yibuapi.com
      - name: DSH_MAX_TOKENS
        value: 131072
      - name: VL_API_URL
        value: http://115.33.106.57:8082/v1
      - name: VL_API_KEY
        value: sk-FBQ3806yDHBY4j2turrLY9ELRyLh0K8zdqF3jQfMpCEjPiwx
      - name: VL_MODEL_ID
        value: gemini-3.7-flash
      resources:
        cpu_request: '2'
        cpu_limit: '3'
        memory_request: 6Gi
        memory_limit: 8Gi
s3:
  s3_uploader_script: /home/ma-user/obsutil/obsutil
  s3_download_script: /home/ma-user/obsutil/obsutil
  bucket_name: obs://s3-asset-b-hd-cce-aifm-nlp-exp
sandbox_id_prefix: zxlinux
sandbox_namespace: omni-env-default-worker


run_config:
  harness_type: openclaw
  start_index: 0
  total_num: 0
  concurrent_num: 4
  sandbox:
    result_log: run.log
    user_proxy_model_local_file: /root/zengxiang/openclaw-hive/uploads/user_proxy_model.json
    openclaw_start_timeout: 80
    harness_local_config_file: /root/zengxiang/openclaw-hive/uploads/openclaw_linux.json
    home: /home/ma-user
  task:
    suffix_api_keys: false
    task_input_path: /root/zengxiang/task_configs_v1009
    task_output_path: "outputs"  # 任务输出路径
    task_complete_record: "complete.jsonl"  # 完成任务记录文件
    task_failed_record: "failed.jsonl"  # 失败任务记录文件
    task_download_path: "downloads"
    main_code_tar:
    main_code_dir: /root/zengxiang/openclaw-task
    main_python_file: "harness_automation.py"  # start脚本文件
    main_python_timeout: 7200
  obs:
    download_timeout: 1200
    upload_timeout: 900
    traj_save_bucket: obs://s3-asset-b-hd-cce-aifm-nlp-exp
    # 注意，traj_save_path 后面不要加 "/"，否则会有两个 "//"在OBS路径上
    traj_save_path: zengxiang/test_linux/1016v1
    skill_download_path: zengxiang/skills/1008/skills_library
    user_config_download_path:
    user_profile_download_path:
    agents_download_path:
    default_skills: